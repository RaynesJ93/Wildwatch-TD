name: Update chest prices
on:
  push:
    paths:
      - '.github/workflows/chest-prices-once.yml'
permissions:
  contents: write
jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update chest prices safely
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements={
            '🪵 Common Chest • 🟡 250 Coins':'🪵 Common Chest • 🟡 250 Coins',
            '🟩 Uncommon Chest • 🟡 450 Coins':'🟩 Uncommon Chest • 🟡 500 Coins',
            '💜 Rare Chest • 🟡 1050 Coins':'💜 Epic Chest • 🟡 750 Coins',
            '🌟 Legendary Chest • 🟡 2000 Coins':'🌟 Legendary Chest • 🟡 1500 Coins',
            'common:250, uncommon:450, epic:1050, legendary:2000':'common:250, uncommon:500, epic:750, legendary:1500',
            'common:250,uncommon:450,epic:1050,legendary:2000':'common:250,uncommon:500,epic:750,legendary:1500'
          }
          for old,new in replacements.items():
            s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chest-prices-once.yml
          git add index.html
          git commit -m "Set chest prices to 250 500 750 1500"
          git push
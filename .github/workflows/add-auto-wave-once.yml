name: Add auto wave toggle
on:
  push:
    paths:
      - '.github/workflows/add-auto-wave-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add auto wave toggle
        run: python3 .github/add-auto-wave.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-auto-wave-once.yml .github/add-auto-wave.py
          git add index.html
          git commit -m "Add auto wave toggle"
          git push

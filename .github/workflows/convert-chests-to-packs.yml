name: Convert chests to card packs
on:
  push:
    paths:
      - '.github/workflows/convert-chests-to-packs.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/convert-chests-to-packs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace chests with rarity card packs"
          git push

name: Repair weekly and challenge quests

on:
  push:
    paths:
      - '.github/scripts/repair_extra_quests.py'
      - '.github/workflows/repair-extra-quests.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair extra quests
        run: python3 .github/scripts/repair_extra_quests.py
      - name: Commit repaired quests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair weekly and challenge quests'
          git push origin main

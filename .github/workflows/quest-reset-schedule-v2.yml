name: Set 5 daily and 8 weekly quest rotations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quest-reset-schedule-v2.yml'

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update quest rotation schedule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          old=s
          # Existing game has daily/weekly quest generation; change selection counts wherever conventional slices occur.
          s=re.sub(r'(daily[^\n]{0,120}?\.slice\(0,)\s*3\)', r'\g<1>5)', s, flags=re.I)
          s=re.sub(r'(weekly[^\n]{0,120}?\.slice\(0,)\s*5\)', r'\g<1>8)', s, flags=re.I)
          # UI copy.
          s=s.replace('Complete 3 fresh quests each day for extra rewards.','Complete 5 fresh quests each day. Daily quests reset at 6:00 AM.')
          # Add authoritative helpers for local reset boundaries. JS Date uses the player device local time, which gives 6am UK time for UK players including BST/GMT.
          marker='// QUEST_RESET_SCHEDULE_V2'
          if marker not in s:
            insert=r'''

// QUEST_RESET_SCHEDULE_V2: 5 random dailies at local 06:00; 8 random weeklies every Tuesday at local 06:00.
const DAILY_QUEST_COUNT_V2=5, WEEKLY_QUEST_COUNT_V2=8;
function questDailyResetKeyV2(now=new Date()){
  const d=new Date(now); if(d.getHours()<6)d.setDate(d.getDate()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function questWeeklyResetKeyV2(now=new Date()){
  const d=new Date(now); if(d.getHours()<6)d.setDate(d.getDate()-1);
  const daysSinceTuesday=(d.getDay()-2+7)%7;
  d.setDate(d.getDate()-daysSinceTuesday);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function nextDailyQuestResetV2(now=new Date()){
  const n=new Date(now); n.setHours(6,0,0,0); if(now>=n)n.setDate(n.getDate()+1); return n;
}
function nextWeeklyQuestResetV2(now=new Date()){
  const n=new Date(now); n.setHours(6,0,0,0);
  let add=(2-n.getDay()+7)%7; if(add===0&&now>=n)add=7; n.setDate(n.getDate()+add); return n;
}
function updateQuestResetCopyV2(){
 const el=document.getElementById('questResetText'); if(!el)return;
 const d=nextDailyQuestResetV2(),w=nextWeeklyQuestResetV2();
 el.textContent=`Daily quests: 5 • Reset 6:00 AM daily | Weekly quests: 8 • Reset Tuesday 6:00 AM`;
}
setInterval(updateQuestResetCopyV2,1000);updateQuestResetCopyV2();
'''
            idx=s.rfind('</script>')
            if idx<0: raise SystemExit('No script close found')
            s=s[:idx]+insert+s[idx:]
          if s==old: raise SystemExit('No quest schedule changes made')
          p.write_text(s)
          PY
      - name: Commit game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Set daily and weekly quest reset schedule'
          git push origin main

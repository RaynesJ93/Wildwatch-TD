name: Upgrade Bee lightning attack
on:
  push:
    paths:
      - '.github/workflows/upgrade-bee-lightning.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/upgrade-bee-lightning.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Bee with chain lightning"
          git push

name: Sloth Koala Animation Cleanup V1
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/remove_sloth_koala_laser_glow_v1.py'
      - '.github/workflows/remove-sloth-koala-laser-glow-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply animation cleanup
        run: python .github/scripts/remove_sloth_koala_laser_glow_v1.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove Sloth Koala laser glow and enlarge attacks"
          git pull --rebase origin main
          git push origin main

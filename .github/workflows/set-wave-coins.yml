name: Set wave coin rewards
on:
  push:
    paths:
      - '.github/workflows/set-wave-coins.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/set-wave-coins.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set permanent coins to 7 per wave only"
          git push

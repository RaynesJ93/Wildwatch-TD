name: Fix Recent Slow Crash V1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/fix_recent_slow_crash_v1.py'
      - '.github/workflows/fix-recent-slow-crash-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply slowdown crash fix
        run: python .github/scripts/fix_recent_slow_crash_v1.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Crow Blackout and recent slowdown abilities"
          git pull --rebase origin main
          git push origin main

name: Buff Sloth Koala Damage V1
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/buff_sloth_koala_damage_v1.py'
      - '.github/workflows/buff-sloth-koala-damage-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/buff_sloth_koala_damage_v1.py
      - name: Commit game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Increase Sloth and Koala base damage by 34 percent'
          git push

name: Cleanup old workflows
on:
  push:
    paths:
      - '.github/workflows/cleanup-old-workflows.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive old one-off workflows
        run: python3 .github/scripts/archive_old_workflows.py
      - name: Commit workflow archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows .github/workflows-disabled
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive old one-off workflows"
          git push

name: Repair weekly quest storage
on:
  push:
    paths:
      - '.github/workflows/repair-weekly-quest-storage.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/repair-weekly-quest-storage.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair weekly quest progress storage"
          git push

name: Add Coral Coast region

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-coral-coast-region.yml'

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Coral Coast region data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='// CORAL_COAST_REGION_V1'
          if marker in s:
            raise SystemExit('Coral Coast already present')
          insert=r'''

// CORAL_COAST_REGION_V1
// Seventh region: follows the existing 10-map progression and introduces one new coastal enemy per map.
const CORAL_COAST_REGION={
  id:'coralCoast',series:7,name:'Coral Coast',icon:'🌊',maps:10,
  theme:{terrain:'tropical coast',path:'shallow water and sand',details:['coral reefs','wooden piers','sandbanks','turquoise water']},
  mapProgression:[
    {map:1,name:'Sandy Shores',introduces:'crab'},
    {map:2,name:'Turtle Bay',introduces:'seaTurtle'},
    {map:3,name:'Seagull Point',introduces:'seagull'},
    {map:4,name:'Reef Run',introduces:'pufferfish'},
    {map:5,name:'Stingray Sands',introduces:'stingray'},
    {map:6,name:'Shark Waters',introduces:'shark'},
    {map:7,name:'Octopus Cove',introduces:'octopus'},
    {map:8,name:'Barracuda Bay',introduces:'barracuda'},
    {map:9,name:'Deepwater Crossing',introduces:'giantLobster'},
    {map:10,name:"Kraken's Reach",introduces:'kraken',boss:true}
  ],
  enemies:{
    crab:{name:'Crab',emoji:'🦀',role:'standard',speed:'normal',hp:'medium'},
    seaTurtle:{name:'Sea Turtle',emoji:'🐢',role:'tank',speed:'slow',hp:'high'},
    seagull:{name:'Seagull',emoji:'🐦',role:'speed',speed:'fast',hp:'low'},
    pufferfish:{name:'Pufferfish',emoji:'🐡',role:'defence',speed:'normal',hp:'medium',ability:'Inflates briefly when hit, reducing incoming damage.'},
    stingray:{name:'Stingray',emoji:'🌊',role:'pressure',speed:'fast',hp:'medium-high'},
    shark:{name:'Shark',emoji:'🦈',role:'all-rounder',speed:'fast',hp:'high'},
    octopus:{name:'Octopus',emoji:'🐙',role:'disruptor',speed:'normal',hp:'high',ability:'Ink splash temporarily slows a nearby tower attack speed.'},
    barracuda:{name:'Barracuda',emoji:'🐟',role:'speed',speed:'very fast',hp:'medium-high'},
    giantLobster:{name:'Giant Lobster',emoji:'🦞',role:'super tank',speed:'very slow',hp:'very high'},
    kraken:{name:'Kraken',emoji:'🦑',role:'boss',speed:'very slow',hp:'boss',ability:'Final Coral Coast boss; smaller sea creatures accompany it.'}
  }
};
window.CORAL_COAST_REGION=CORAL_COAST_REGION;
// Later maps retain all previously introduced Coral Coast enemies, creating increasingly mixed waves.
function coralCoastEnemyPool(mapNumber){
  const order=['crab','seaTurtle','seagull','pufferfish','stingray','shark','octopus','barracuda','giantLobster','kraken'];
  return order.slice(0,Math.max(1,Math.min(10,Number(mapNumber)||1)));
}
window.coralCoastEnemyPool=coralCoastEnemyPool;
'''
          idx=s.rfind('</script>')
          if idx<0: raise SystemExit('No closing script tag found')
          s=s[:idx]+insert+s[idx:]
          p.write_text(s)
          PY
      - name: Commit game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Coral Coast region and enemy progression'
          git push origin main

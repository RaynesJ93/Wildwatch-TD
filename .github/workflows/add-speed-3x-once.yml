name: Add 3x battle speed
on:
  push:
    paths:
      - '.github/workflows/add-speed-3x-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 3x speed
        run: python3 .github/add-speed-3x.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-speed-3x-once.yml .github/add-speed-3x.py
          git add index.html
          git commit -m "Add 3x battle speed option"
          git push

name: Four Tower Attack Upgrades V1
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_peacock_turtle_lizard_scorpion_attacks_v1.py'
      - '.github/workflows/add-peacock-turtle-lizard-scorpion-attacks-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/add_peacock_turtle_lizard_scorpion_attacks_v1.py
      - name: Commit game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add attacks and level 10 abilities for Peacock Turtle Lizard Scorpion'
          git push

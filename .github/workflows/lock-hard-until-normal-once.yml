name: Lock Hard until Normal clear
on:
  push:
    paths:
      - '.github/workflows/lock-hard-until-normal-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Hard Mode lock
        run: python3 .github/lock_hard_until_normal_once.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lock-hard-until-normal-once.yml .github/lock_hard_until_normal_once.py
          git add index.html
          git commit -m "Require Normal clear before Hard Mode"
          git push

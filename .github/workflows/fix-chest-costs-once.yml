name: Fix actual chest costs
on:
  push:
    paths:
      - '.github/workflows/fix-chest-costs-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('common:{name:"Common Chest",cost:250','common:{name:"Common Chest",cost:250',1)
          s=s.replace('uncommon:{name:"Uncommon Chest",cost:450','uncommon:{name:"Uncommon Chest",cost:500',1)
          s=s.replace('epic:{name:"Rare Chest",cost:1050','epic:{name:"Rare Chest",cost:750',1)
          s=s.replace('legendary:{name:"Legendary Chest",cost:2000','legendary:{name:"Legendary Chest",cost:1500',1)
          # Also ensure visible labels match actual purchase costs.
          s=s.replace('🟩 Uncommon Chest • 🟡 450 Coins','🟩 Uncommon Chest • 🟡 500 Coins')
          s=s.replace('💜 Rare Chest • 🟡 1050 Coins','💜 Rare Chest • 🟡 750 Coins')
          s=s.replace('🌟 Legendary Chest • 🟡 2000 Coins','🌟 Legendary Chest • 🟡 1500 Coins')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-chest-costs-once.yml
          git add index.html
          git commit -m "Fix chest purchase costs"
          git push
name: Update butterfly combat
on:
  push:
    paths:
      - '.github/workflows/update-butterfly.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/update-butterfly.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Buff butterfly and add seed pod projectile"
          git push

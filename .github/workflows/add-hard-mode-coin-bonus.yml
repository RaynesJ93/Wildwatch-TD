name: Add Hard Mode coin bonus
on:
  push:
    paths:
      - '.github/workflows/add-hard-mode-coin-bonus.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 30 percent Hard Mode coin bonus
        run: python3 .github/scripts/add_hard_mode_coin_bonus.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add 30 percent Hard Mode coin bonus"
          git push

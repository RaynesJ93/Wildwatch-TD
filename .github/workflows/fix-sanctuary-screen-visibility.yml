name: Fix Sanctuary screen visibility
on:
  push:
    paths:
      - '.github/workflows/fix-sanctuary-screen-visibility.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Sanctuary visibility
        run: python .github/fix-sanctuary-screen-visibility.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Sanctuary only showing on Battle screen"
          git push

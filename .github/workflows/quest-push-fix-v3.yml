name: Fix and push daily weekly quest update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quest-push-fix-v3.yml'

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply quest update
        run: python3 -c "$(echo '' | base64 -d)"
      - name: Commit game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply daily weekly quest update' || exit 0
          git push origin main

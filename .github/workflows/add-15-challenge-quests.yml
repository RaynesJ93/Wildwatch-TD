name: Add 15 challenge quests
on:
  push:
    paths:
      - '.github/workflows/add-15-challenge-quests.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add challenge quests
        run: python3 .github/scripts/add_15_challenge_quests.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add 15 permanent challenge quests"
          git push

name: Add series difficulty

on:
  push:
    paths:
      - '.github/workflows/add-series-difficulty.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add series difficulty multipliers
        run: python3 .github/scripts/add_series_difficulty.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add series difficulty multipliers"
          git push

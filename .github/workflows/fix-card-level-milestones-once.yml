name: Fix card level milestones
on:
  push:
    paths:
      - '.github/workflows/fix-card-level-milestones-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix milestones
        run: python3 .github/fix_card_level_milestones_once.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-card-level-milestones-once.yml .github/fix_card_level_milestones_once.py
          git add index.html
          git commit -m "Align card level milestone bonuses"
          git push

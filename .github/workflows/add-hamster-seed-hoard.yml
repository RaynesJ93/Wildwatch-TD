name: Add Hamster Seed Hoard
on:
  push:
    paths:
      - '.github/workflows/add-hamster-seed-hoard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Hamster Seed Spit and Hamster Hoard
        run: python3 .github/scripts/add_hamster_seed_hoard.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Hamster Seed Spit and Hamster Hoard"
          git push

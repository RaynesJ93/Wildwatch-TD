name: Apply rarity rebalance

on:
  push:
    paths:
      - '.github/workflows/apply-rarity-rebalance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock Legendary Pack until level 20
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''  const cfg=chestConfig[btn.dataset.chest];
  if(save.metaCoins<cfg.cost){alert(`You need ${cfg.cost} Coins for this pack. Earn more by completing levels.`);return}'''
          new='''  const cfg=chestConfig[btn.dataset.chest];
  if(btn.dataset.chest==='legendary' && (save.level||1)<20){alert(`🔒 Legendary Packs unlock at Player Level 20. You are currently Level ${save.level||1}.`);return}
  if(save.metaCoins<cfg.cost){alert(`You need ${cfg.cost} Coins for this pack. Earn more by completing levels.`);return}'''
          if new in s:
              pass
          elif old in s:
              s=s.replace(old,new,1)
          else:
              raise SystemExit('Could not locate pack purchase handler')
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Lock Legendary Pack until player level 20"
          git push

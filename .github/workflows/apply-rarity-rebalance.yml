name: Apply rarity rebalance

on:
  push:
    paths:
      - '.github/workflows/apply-rarity-rebalance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update rarity level gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='const minLevel={Common:1,Uncommon:1,Rare:3,Legendary:6}[rarity]||1;'
          new='const minLevel={Common:1,Uncommon:1,Rare:10,Legendary:20}[rarity]||1;'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('Could not locate rarity level gates')
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Lock Rare cards at level 10 and Legendary at level 20"
          git push

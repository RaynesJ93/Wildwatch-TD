name: Fix named save slots once
on:
  push:
    paths:
      - '.github/workflows/fix-named-save-slots-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix named save slots
        run: python3 .github/fix_named_save_slots.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-named-save-slots-once.yml .github/fix_named_save_slots.py
          git add index.html
          git commit -m "Fix save slot loading and add names"
          git push

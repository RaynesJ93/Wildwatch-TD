name: Repair quest system
on:
  push:
    paths:
      - '.github/workflows/repair-quest-system.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair quest tracking and rewards
        run: python .github/repair-quest-system.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Repair daily weekly milestone and challenge quests"
          git push

name: Set Goose base damage 20
on:
  push:
    paths:
      - '.github/workflows/set-goose-base-damage-20.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Goose damage
        run: python .github/set-goose-base-damage-20.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Set Goose base damage to 20"
          git push

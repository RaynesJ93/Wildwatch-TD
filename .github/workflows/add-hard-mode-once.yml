name: Add hard mode
on:
  push:
    paths:
      - '.github/workflows/add-hard-mode-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hard mode
        run: python3 .github/add_hard_mode_once.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-hard-mode-once.yml .github/add_hard_mode_once.py
          git add index.html
          git commit -m "Add Normal and Hard difficulty modes"
          git push

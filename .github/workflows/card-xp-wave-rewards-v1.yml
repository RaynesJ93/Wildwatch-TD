name: Card XP Wave Rewards V1
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/card_xp_wave_rewards_v1.py'
      - '.github/workflows/card-xp-wave-rewards-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply card XP wave rewards
        run: python .github/scripts/card_xp_wave_rewards_v1.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Change card XP to per-wave deck rewards"
          git pull --rebase origin main
          git push origin main

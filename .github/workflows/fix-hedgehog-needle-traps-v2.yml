name: Fix Hedgehog needle traps v2
on:
  push:
    paths:
      - '.github/workflows/fix-hedgehog-needle-traps-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fix-hedgehog-needle-traps-v2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Hedgehog needle trap timing and collision"
          git push

name: Set common collection EXP reward
on:
  push:
    paths:
      - '.github/workflows/set-common-all-exp-reward.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/set-common-all-exp-reward.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change all Common cards milestone reward to 500 EXP"
          git push

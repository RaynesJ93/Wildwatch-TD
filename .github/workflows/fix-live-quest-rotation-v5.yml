name: Fix live quest rotation v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-quest-rotation-v5.yml'

permissions:
  contents: write

jobs:
  patch-quests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch quest system
        run: python3 .github/scripts/fix_live_quest_v5.py
      - name: Commit quest fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix and refresh Daily and Weekly quests'
          git push origin main
# trigger-v3

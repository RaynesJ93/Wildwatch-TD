name: Map Summary Damage V1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/map_summary_damage_v1.py'
      - '.github/workflows/map-summary-damage-v1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --rebase origin main
      - run: python .github/scripts/map_summary_damage_v1.py
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair elite waves and map completion summary"
          git push origin main

name: Add Sanctuary map menu
on:
  push:
    paths:
      - '.github/workflows/add-sanctuary-map-menu.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Sanctuary map menu
        run: python .github/add-sanctuary-map-menu.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Sanctuary style interactive map menu"
          git push

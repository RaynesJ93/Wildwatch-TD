name: Goose egg poison special
on:
  push:
    paths:
      - '.github/workflows/add-goose-egg-poison-special.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/add-goose-egg-poison-special.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Add Goose egg poison special"
          git push
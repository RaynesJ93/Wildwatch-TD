name: Add First targeting and lower Silverback upgrade cost

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/target-first-silverback-cost.yml'

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update targeting and Silverback upgrade cost
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old=s
          s=s.replace('<option value="closest">Closest</option>\n        <option value="strongest">Strongest</option>', '<option value="closest">Closest</option>\n        <option value="first">First</option>\n        <option value="strongest">Strongest</option>')
          s=s.replace('Closest = nearest enemy • Strongest = highest HP • Last = furthest back on the path', 'Closest = nearest enemy • First = furthest along the path • Strongest = highest HP • Last = furthest back on the path')
          # Existing Silverback multiplier is .45. Reduce its upgrade price by another 20% => .36.
          s=s.replace('selectedTower.key==="silverback"?.45:.65', 'selectedTower.key==="silverback"?.36:.65')
          s=s.replace('t.key==="silverback"?.45:.65', 't.key==="silverback"?.36:.65')
          # Add First targeting immediately before Last using the inverse path-progress priority.
          needle='''    }else if(mode==="last"){
      target=inRange.reduce((best,e)=>{'''
          repl='''    }else if(mode==="first"){
      target=inRange.reduce((best,e)=>!best||(e.pathIndex||0)>(best.pathIndex||0)?e:best,null);
    }else if(mode==="last"){
      target=inRange.reduce((best,e)=>{'''
          if needle in s:
              s=s.replace(needle,repl,1)
          if s==old:
              raise SystemExit('Expected targeting/upgrade code not found; refusing unrelated change.')
          p.write_text(s)
          PY
      - name: Commit game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add First targeting and reduce Silverback upgrade cost 20 percent'
          git push origin main

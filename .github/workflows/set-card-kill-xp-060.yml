name: Set card kill XP 0.60

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-card-kill-xp-060.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set card kill XP
        run: python3 scripts/set-card-kill-xp-060.py
      - name: Commit game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Change card kill XP to 0.60'
          git push origin main

name: Rework save screen once
on:
  push:
    paths:
      - '.github/workflows/rework-save-screen-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/rework_save_screen.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rework-save-screen-once.yml .github/rework_save_screen.py
          git add index.html
          git commit -m "Move save slots to dedicated play screen"
          git push

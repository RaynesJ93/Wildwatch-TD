name: Update Critter Clash icon
on:
  push:
    paths:
      - '.github/workflows/critter-clash-icon-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write new icon
        run: python3 .github/critter_clash_icon_once.py
      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/critter-clash-icon-once.yml .github/critter_clash_icon_once.py
          git add assets/apple-touch-icon.png
          git commit -m "Update home screen icon to Critter Clash"
          git push

name: Change card XP growth to 15 percent
on:
  push:
    paths:
      - '.github/workflows/change-xp-growth-15-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change card XP growth
        run: python3 .github/change-xp-growth-15.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/change-xp-growth-15-once.yml .github/change-xp-growth-15.py
          git add index.html
          git commit -m "Reduce card XP growth to 15 percent per level"
          git push

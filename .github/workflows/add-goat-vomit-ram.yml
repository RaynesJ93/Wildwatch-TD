name: Add Goat Vomit and Ram
on:
  push:
    paths:
      - '.github/workflows/add-goat-vomit-ram.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Goat attack and Level 10 ability
        run: python3 .github/scripts/add-goat-vomit-ram.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Goat Vomit Spray and Ram Rage"
          git push

name: Cross Out Claimed Quests V1
on:
  push:
    paths:
      - '.github/workflows/cross-out-claimed-quests-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply quest strike-through
        run: python .github/scripts/cross_out_claimed_quests_v1.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cross out claimed Milestone and Challenge quests"
          git push origin main

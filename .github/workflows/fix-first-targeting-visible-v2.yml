name: Fix First targeting visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-first-targeting-visible-v2.yml'

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch First targeting menu and logic
        run: python3 -c "$(echo '' | base64 -d)"
      - name: Commit game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show and implement First tower targeting'
          git push origin main

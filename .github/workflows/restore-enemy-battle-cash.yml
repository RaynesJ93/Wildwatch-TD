name: Restore enemy battle cash
on:
  push:
    paths:
      - '.github/workflows/restore-enemy-battle-cash.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore enemy battle cash
        run: python3 .github/scripts/restore_enemy_battle_cash.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore enemy battle cash rewards"
          git push

name: Add Tundra Falls

on:
  push:
    paths:
      - '.github/workflows/add-final-map-bosses.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Tundra Falls fourth map series
        run: python3 .github/scripts/add_tundra_falls.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Tundra Falls fourth map series"
          git push

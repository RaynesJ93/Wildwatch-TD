name: Fix Raccoon card level 10 ability
on:
  push:
    paths:
      - '.github/workflows/fix-raccoon-card-level10.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fix-raccoon-card-level10.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Raccoon level 10 trash ability"
          git push

name: Restore Rare chest label
on:
  push:
    paths:
      - '.github/workflows/rare-label-once.yml'
permissions:
  contents: write
jobs:
  update-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('💜 Epic Chest • 🟡 750 Coins','💜 Rare Chest • 🟡 750 Coins'); p.write_text(s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rare-label-once.yml
          git add index.html
          git commit -m "Restore Rare Chest label"
          git push
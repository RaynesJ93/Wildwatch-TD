name: Improve Desert and Haunted visuals

on:
  push:
    paths:
      - '.github/workflows/improve-desert-haunted-visuals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve Desert and Haunted canvas assets
        run: python3 .github/scripts/improve_desert_haunted_visuals.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve Desert and Haunted map visuals"
          git push

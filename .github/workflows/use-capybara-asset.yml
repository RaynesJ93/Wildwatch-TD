name: Use Capybara game asset
on:
  push:
    paths:
      - '.github/workflows/use-capybara-asset.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/use-capybara-asset.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use Capybara asset throughout game"
          git push

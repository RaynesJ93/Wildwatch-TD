name: Update Mastery Rewards V2
on:
  push:
    paths:
      - '.github/workflows/update-mastery-rewards-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stronger mastery rewards
        run: python .github/scripts/update_mastery_rewards_v2.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Upgrade mastery rewards and reserve M10 ability"
          git push

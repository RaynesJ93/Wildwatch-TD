name: Set chest tiers
on:
  push:
    paths:
      - '.github/workflows/set-chest-tiers-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply chest tier rules
        run: python3 .github/set_chest_tiers_once.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/set-chest-tiers-once.yml .github/set_chest_tiers_once.py
          git add index.html
          git commit -m "Restrict chests to matching card tiers"
          git push

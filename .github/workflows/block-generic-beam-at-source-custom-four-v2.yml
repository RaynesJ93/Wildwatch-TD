name: Block Generic Beam At Source Custom Four V2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/block_generic_beam_at_source_custom_four_v2.py'
      - '.github/workflows/block-generic-beam-at-source-custom-four-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source-level generic beam block
        run: python .github/scripts/block_generic_beam_at_source_custom_four_v2.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Block generic beam creation for Peacock Turtle Lizard Scorpion"
          git pull --rebase origin main
          git push origin main

name: Card XP Map Completion V2
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/card_xp_map_completion_v2.py'
      - '.github/workflows/card-xp-map-completion-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply map completion XP change
        run: python .github/scripts/card_xp_map_completion_v2.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move 300 card XP reward to map completion"
          git pull --rebase origin main
          git push origin main

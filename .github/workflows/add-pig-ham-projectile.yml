name: Add Pig ham projectile
on:
  push:
    paths:
      - '.github/workflows/add-pig-ham-projectile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Pig projectile update
        run: python .github/add-pig-ham-projectile.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No Pig changes needed"
            exit 0
          fi
          git commit -m "Make Pig fire bacon projectile"
          git push origin main

name: Add Rabbit Bunny Barrage
on:
  push:
    paths:
      - '.github/workflows/add-rabbit-bunny-barrage.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Rabbit Carrot Kick and Bunny Barrage
        run: python3 .github/scripts/add_rabbit_bunny_barrage.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Rabbit Carrot Kick and Bunny Barrage"
          git push

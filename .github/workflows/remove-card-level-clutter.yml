name: Remove card level clutter
on:
  push:
    paths:
      - '.github/workflows/remove-card-level-clutter.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove repeated card level text
        run: python .github/remove-card-level-clutter.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove repeated card level explanation"
          git push

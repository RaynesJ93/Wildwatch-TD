name: Update chest shard ranges
on:
  push:
    paths:
      - '.github/workflows/update-chest-shard-ranges-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update chest shard rewards
        run: python3 .github/update-chest-shard-ranges.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-chest-shard-ranges-once.yml .github/update-chest-shard-ranges.py
          git add index.html
          git commit -m "Update rare and legendary chest shard rewards"
          git push

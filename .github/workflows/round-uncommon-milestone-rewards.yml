name: Round uncommon milestone rewards
on:
  push:
    paths:
      - '.github/workflows/round-uncommon-milestone-rewards.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/round-uncommon-milestone-rewards.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set uncommon milestone rewards to 30 and 60 coins"
          git push

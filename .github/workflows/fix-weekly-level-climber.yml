name: Fix weekly Level Climber tracking
on:
  push:
    paths:
      - '.github/workflows/fix-weekly-level-climber.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fix-weekly-level-climber.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix weekly Level Climber tracking"
          git push

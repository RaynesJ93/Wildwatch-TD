name: Add Dog Fetch V1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/add_dog_fetch_v1.py'
      - '.github/workflows/add-dog-fetch-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Dog update
        run: python .github/scripts/add_dog_fetch_v1.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Dog Bark Blast and Fetch"
          git pull --rebase origin main
          git push origin main

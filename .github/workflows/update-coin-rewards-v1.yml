name: Update Coin Rewards V1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/update_coin_rewards_v1.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Update coin rewards
        run: python .github/scripts/update_coin_rewards_v1.py
      - name: Commit game update
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Increase wave elite and boss coin rewards"
          git push origin main

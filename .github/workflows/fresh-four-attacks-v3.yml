name: Fresh Four Attacks V3
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fresh_four_attacks_v3.py'
      - '.github/workflows/fresh-four-attacks-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild four animal attacks
        run: python .github/scripts/fresh_four_attacks_v3.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild Peacock Turtle Lizard Scorpion attacks from scratch"
          git pull --rebase origin main
          git push origin main

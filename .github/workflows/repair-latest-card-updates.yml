name: Repair latest card updates

on:
  push:
    paths:
      - '.github/scripts/repair_squirrel.py'
      - '.github/workflows/repair-latest-card-updates.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Squirrel repair
        run: python3 .github/scripts/repair_squirrel.py
      - name: Commit repaired game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Squirrel nut attack and level 10 split'
          git push origin main

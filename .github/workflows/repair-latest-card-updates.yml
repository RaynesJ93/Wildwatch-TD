name: Repair latest card updates

on:
  push:
    paths:
      - '.github/workflows/repair-latest-card-updates.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair card changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Card descriptions.
          s=s.replace('crocodile:{name:"Crocodile",emoji:"🐊",rarity:"Rare",cost:150,range:135,rate:1/.60,dmg:60,color:"#586",desc:"Massive close-range damage."},',
                      'crocodile:{name:"Crocodile",emoji:"🐊",rarity:"Rare",cost:150,range:135,rate:1/.60,dmg:60,color:"#586",desc:"Tail-swipe bruiser. At tower level 10, every 5th attack triggers Death Roll: 3x damage and locks the target in place for 1.5s."},',1)
          s=s.replace('buffalo:{name:"Buffalo",emoji:"🐃",rarity:"Rare",cost:132,range:155,rate:1/.75,dmg:47,color:"#654",desc:"Heavy attacker."},',
                      'buffalo:{name:"Buffalo",emoji:"🐃",rarity:"Rare",cost:132,range:155,rate:1/.75,dmg:47,color:"#654",desc:"Headbutts enemies. At tower level 10, every 6th attack becomes Stampede: 2x damage to the main target, 65% damage to nearby enemies, and a brief knockback."},',1)
          s=s.replace('giraffe:{name:"Giraffe",emoji:"🦒",rarity:"Legendary",cost:175,range:275,rate:1/.85,dmg:55,color:"#db7",desc:"Exceptional range attacker."},',
                      'giraffe:{name:"Giraffe",emoji:"🦒",rarity:"Legendary",cost:175,range:275,rate:1/.85,dmg:55,color:"#db7",desc:"Exceptional range attacker. Swings its neck to deal full area damage around the target."},',1)

          # 35% cheaper standard upgrades, while preserving Pig and Tiger custom prices.
          reps={
            'const mult=selectedTower.key==="pig"?.8:selectedTower.key==="tiger"?.64:1;':'const mult=selectedTower.key==="pig"?.8:selectedTower.key==="tiger"?.64:.65;',
            'up=Math.floor(a.cost*.595*t.level*(t.key==="pig"?.8:t.key==="tiger"?.64:1));':'up=Math.floor(a.cost*.595*t.level*(t.key==="pig"?.8:t.key==="tiger"?.64:.65));',
            'cost=Math.floor(a.cost*.595*selectedTower.level*(selectedTower.key==="pig"?.8:selectedTower.key==="tiger"?.64:1));':'cost=Math.floor(a.cost*.595*selectedTower.level*(selectedTower.key==="pig"?.8:selectedTower.key==="tiger"?.64:.65));'
          }
          for old,new in reps.items():
            if old not in s: raise SystemExit('Upgrade formula marker missing: '+old)
            s=s.replace(old,new,1)

          # Dedicated attacks inserted before Tiger.
          attack_marker='''  if(t.key==="tiger"){
    let tigerRoar=false;'''
          if attack_marker not in s: raise SystemExit('Tiger attack marker not found')
          attack_block='''  if(t.key==="crocodile"){
    let deathRoll=false;
    if(t.level>=10){t.crocAttackCount=(t.crocAttackCount||0)+1;deathRoll=t.crocAttackCount%5===0;}
    battle.shots.push({x:t.x,y:t.y-4,tx:target.x,ty:target.y,life:deathRoll?.62:.34,maxLife:deathRoll?.62:.34,type:deathRoll?"crocDeathRoll":"crocTail"});
    target.hp-=deathRoll?dmg*3:dmg;
    if(deathRoll)target.freezeTimer=Math.max(target.freezeTimer||0,1.5);
    if(target.hp<=0)killEnemy(target);
    t.cd=cardRate(t.key);return;
  }

  if(t.key==="buffalo"){
    let stampede=false;
    if(t.level>=10){t.buffaloAttackCount=(t.buffaloAttackCount||0)+1;stampede=t.buffaloAttackCount%6===0;}
    battle.shots.push({x:t.x,y:t.y-4,tx:target.x,ty:target.y,life:stampede?.34:.24,maxLife:stampede?.34:.24,type:"buffaloHeadbutt",special:stampede});
    target.hp-=stampede?dmg*2:dmg;
    if(target.hp<=0)killEnemy(target);
    if(stampede){battle.enemies.forEach(e=>{if(e.dead||e===target)return;if(Math.hypot(e.x-target.x,e.y-target.y)<=105){e.hp-=dmg*.65;e.tigerRoar=Math.max(e.tigerRoar||0,.75);if(e.hp<=0)killEnemy(e);}})}
    t.cd=cardRate(t.key);return;
  }

  if(t.key==="giraffe"){
    battle.shots.push({x:t.x,y:t.y-10,tx:target.x,ty:target.y,life:.34,maxLife:.34,type:"giraffeNeckSwing",radius:92});
    const victims=battle.enemies.filter(e=>!e.dead&&Math.hypot(e.x-target.x,e.y-target.y)<=92);
    if(!victims.includes(target)&&!target.dead)victims.unshift(target);
    victims.forEach(e=>{e.hp-=dmg;if(e.hp<=0)killEnemy(e)});
    t.cd=cardRate(t.key);return;
  }

'''
          if 'type:deathRoll?"crocDeathRoll":"crocTail"' not in s:
            s=s.replace(attack_marker,attack_block+attack_marker,1)

          # Projectile/attack visuals before Tiger swipe renderer.
          draw_marker='''    }else if(s.type==="tigerSwipe"){'''
          if draw_marker not in s: raise SystemExit('Tiger draw marker not found')
          draw_block='''    }else if(s.type==="crocTail"||s.type==="crocDeathRoll"){
      const q=1-Math.max(0,s.life)/(s.maxLife||(s.type==="crocDeathRoll"?.62:.34));
      const x=s.x+(s.tx-s.x)*Math.min(1,q*1.15),y=s.y+(s.ty-s.y)*Math.min(1,q*1.15),ang=Math.atan2(s.ty-s.y,s.tx-s.x);
      ctx.save();ctx.translate(x,y);ctx.rotate(ang+Math.sin(q*Math.PI)*(s.type==="crocDeathRoll"?5.5:1.4));ctx.strokeStyle=s.type==="crocDeathRoll"?"#d8ff72":"#7fbf54";ctx.lineWidth=s.type==="crocDeathRoll"?10:8;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-25,0);ctx.quadraticCurveTo(0,-18,25,0);ctx.stroke();ctx.beginPath();ctx.moveTo(-20,4);ctx.quadraticCurveTo(0,20,22,5);ctx.stroke();if(s.type==="crocDeathRoll"){ctx.globalAlpha=.75;ctx.strokeStyle="#f4ffaf";ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,24+q*18,0,Math.PI*2);ctx.stroke()}ctx.restore();return;
    }else if(s.type==="buffaloHeadbutt"){
      const q=1-Math.max(0,s.life)/(s.maxLife||.24),x=s.x+(s.tx-s.x)*q,y=s.y+(s.ty-s.y)*q,ang=Math.atan2(s.ty-s.y,s.tx-s.x);ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.translate(Math.sin(Math.PI*q)*12,0);ctx.font=s.special?"42px sans-serif":"34px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("🐃",0,0);if(s.special){ctx.globalAlpha=Math.max(0,1-q);ctx.strokeStyle="#e8c56a";ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,18+q*70,0,Math.PI*2);ctx.stroke()}ctx.restore();return;
    }else if(s.type==="giraffeNeckSwing"){
      const q=1-Math.max(0,s.life)/(s.maxLife||.34),dx=s.tx-s.x,dy=s.ty-s.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,bend=Math.sin(q*Math.PI)*42,cx=(s.x+s.tx)/2+nx*bend,cy=(s.y+s.ty)/2+ny*bend;ctx.save();ctx.globalAlpha=Math.max(.15,1-q*.7);ctx.lineCap="round";ctx.strokeStyle="#d5a34d";ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo(cx,cy,s.tx,s.ty);ctx.stroke();ctx.strokeStyle="#8a5b20";ctx.lineWidth=3;ctx.stroke();ctx.translate(s.tx,s.ty);ctx.globalAlpha=Math.max(0,.65-q*.45);ctx.strokeStyle="#f1c86a";ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,(s.radius||92)*q,0,Math.PI*2);ctx.stroke();ctx.restore();return;
'''
          if 's.type==="crocTail"||s.type==="crocDeathRoll"' not in s:
            s=s.replace(draw_marker,draw_block+draw_marker,1)

          p.write_text(s,encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair Crocodile Buffalo Giraffe and upgrade costs'
          git push origin main

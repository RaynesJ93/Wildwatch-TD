name: Polish wave button and font
on:
  push:
    paths:
      - '.github/workflows/polish-wave-button-font-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply wave HUD polish
        run: python3 .github/polish-wave-button-font.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/polish-wave-button-font-once.yml .github/polish-wave-button-font.py
          git add index.html
          git commit -m "Polish wave button sizing and game font"
          git push

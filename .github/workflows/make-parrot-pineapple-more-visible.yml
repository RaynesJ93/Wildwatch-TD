name: Make Parrot pineapple more visible
on:
  push:
    paths:
      - '.github/workflows/make-parrot-pineapple-more-visible.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/make-parrot-pineapple-more-visible.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Parrot pineapple projectile clearly visible"
          git push

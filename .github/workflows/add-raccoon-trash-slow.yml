name: Add Raccoon trash slow ability
on:
  push:
    paths:
      - '.github/workflows/add-raccoon-trash-slow.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/add-raccoon-trash-slow.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Raccoon dustbin trash slow ability"
          git push

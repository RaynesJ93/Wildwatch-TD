name: Fix quest progress v1
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-quest-progress-v1.py
      - run: git add index.html && git -c user.name=github-actions -c user.email=actions@github.com commit -m "Fix Daily and Weekly quest progress tracking" && git push

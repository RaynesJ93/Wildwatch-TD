name: Fix quest progress v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-quest-progress-v1.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/fix-quest-progress-v1.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Fix Daily and Weekly quest progress tracking'
          git push origin main

name: Fix Volcanic Unlock Existing Saves V1
on:
  push:
    paths:
      - '.github/workflows/fix-volcanic-unlock-existing-saves-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Fix Volcanic Wasteland unlock migration
        run: python .github/scripts/fix_volcanic_unlock_existing_saves_v1.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Volcanic Wasteland unlock for existing saves"
          git push origin main

name: Compact battle screen
on:
  push:
    paths:
      - '.github/workflows/compress-battle-screen-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact battle layout
        run: python3 .github/compress-battle-screen.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/compress-battle-screen-once.yml .github/compress-battle-screen.py
          git add index.html
          git commit -m "Compress battle screen to fit without scrolling"
          git push

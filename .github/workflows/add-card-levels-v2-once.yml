name: Add card levelling system v2
on:
  push:
    paths:
      - '.github/workflows/add-card-levels-v2-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply card levelling system
        run: python3 .github/add_card_levels_once.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-card-levels-v2-once.yml .github/workflows/add-card-levels-once.yml .github/add_card_levels_once.py
          git add index.html
          git commit -m "Replace damage upgrades with card levelling system"
          git push

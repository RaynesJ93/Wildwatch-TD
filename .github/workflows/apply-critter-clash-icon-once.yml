name: Apply Critter Clash home screen icon
on:
  push:
    paths:
      - '.github/workflows/apply-critter-clash-icon-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install new icon
        run: |
          base64 -d .github/critter_clash_icon.b64 > assets/apple-touch-icon.png
          sed -i 's/apple-touch-icon.png?v=2/apple-touch-icon.png?v=3/g' index.html
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/critter_clash_icon.b64 .github/workflows/apply-critter-clash-icon-once.yml
          git add assets/apple-touch-icon.png index.html
          git commit -m "Use Critter Clash home screen icon"
          git push

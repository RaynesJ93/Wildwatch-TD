name: Fix Hedgehog attacks without enemies
on:
  push:
    paths:
      - '.github/workflows/fix-hedgehog-autotrap-live.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fix-hedgehog-autotrap-live.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Hedgehog laying traps without nearby enemies"
          git push

name: Add Haunted Woods series
on:
  push:
    paths:
      - '.github/workflows/add-haunted-woods-series.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Haunted Woods series
        run: python .github/add-haunted-woods-series.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Haunted Woods third map series"
          git push

name: Fix Packs Vine Frame V1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/fix_packs_vine_frame_v1.py'
      - '.github/workflows/fix-packs-vine-frame-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fit Packs vine frame
        run: python .github/scripts/fix_packs_vine_frame_v1.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fit Packs vine frame and remove gold border"
          git pull --rebase origin main
          git push origin main

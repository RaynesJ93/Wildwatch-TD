name: Replace battle coin system
on:
  push:
    paths:
      - '.github/workflows/replace-battle-coin-system.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old battle coin rewards
        run: python3 .github/scripts/replace_battle_coin_system.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Replace battle coin reward system"
          git push

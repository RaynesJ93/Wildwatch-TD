name: Elite Waves V2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/elite_waves_v2.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: git pull --rebase origin main
      - run: python .github/scripts/elite_waves_v2.py
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add 2 elites on wave 5 and 6 elites on wave 10"
          git push origin main

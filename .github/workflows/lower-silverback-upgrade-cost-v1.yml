name: Lower Silverback Upgrade Cost V1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/lower_silverback_upgrade_cost_v1.py'
      - '.github/workflows/lower-silverback-upgrade-cost-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update main
        run: git pull --rebase origin main
      - name: Lower Silverback upgrade costs
        run: python .github/scripts/lower_silverback_upgrade_cost_v1.py
      - name: Commit game update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Lower Silverback Gorilla upgrade costs'
          git push origin main

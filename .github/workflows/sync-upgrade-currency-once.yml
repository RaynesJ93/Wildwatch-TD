name: Sync tower upgrade currency live
on:
  push:
    paths:
      - '.github/workflows/sync-upgrade-currency-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync upgrade panel currency
        run: python3 .github/sync-upgrade-currency.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-upgrade-currency-once.yml .github/sync-upgrade-currency.py
          git add index.html
          git commit -m "Keep tower upgrade currency synced live"
          git push

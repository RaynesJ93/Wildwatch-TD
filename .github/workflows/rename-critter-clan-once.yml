name: Rename Critter Clan
on:
  push:
    paths:
      - '.github/workflows/rename-critter-clan-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename game
        run: python3 .github/rename_critter_clan_once.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rename-critter-clan-once.yml .github/rename_critter_clan_once.py
          git add index.html README.md
          git commit -m "Rename game to Critter Clan Tower Defence"
          git push

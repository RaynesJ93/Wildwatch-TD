name: Add thematic map bases

on:
  push:
    paths:
      - '.github/workflows/add-thematic-map-bases.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add region-specific bases
        run: python3 .github/scripts/add_thematic_map_bases.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add thematic map base assets"
          git push

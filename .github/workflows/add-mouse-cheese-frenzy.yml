name: Add Mouse Cheese Frenzy
on:
  push:
    paths:
      - '.github/workflows/add-mouse-cheese-frenzy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Mouse Cheese Chuck and Cheese Frenzy
        run: python3 .github/scripts/add_mouse_cheese_frenzy.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Mouse Cheese Chuck and Cheese Frenzy"
          git push

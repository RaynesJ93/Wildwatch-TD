name: Make Elephant Rare
on:
  push:
    paths:
      - '.github/workflows/elephant-rare-once.yml'
permissions:
  contents: write
jobs:
  update-elephant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='elephant:{name:"Elephant", emoji:"🐘", rarity:"Epic"'
          new='elephant:{name:"Elephant", emoji:"🐘", rarity:"Rare"'
          if old not in s: raise SystemExit('Elephant Epic rarity not found')
          s=s.replace(old,new,1)
          s=s.replace('desc:"Epic water attacker that sprays a continuous stream from its trunk."','desc:"Rare water attacker that sprays a continuous stream from its trunk."',1)
          # Internal chest key epic is the user-facing Rare Chest, so keep Elephant restricted to it.
          rule='if(k==="elephant") return btn.dataset.chest==="epic";'
          if rule not in s: raise SystemExit('Elephant Rare chest exclusivity rule missing')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/elephant-rare-once.yml
          git add index.html
          git commit -m "Make Elephant Rare and Rare Chest exclusive"
          git push
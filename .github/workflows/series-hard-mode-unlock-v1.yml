name: Series Hard Mode Unlock V1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/series_hard_mode_unlock_v1.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update main
        run: git pull --rebase origin main
      - name: Apply series Hard Mode unlock update
        run: python .github/scripts/series_hard_mode_unlock_v1.py
      - name: Commit game update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Unlock Hard Mode per completed series'
          git push origin main

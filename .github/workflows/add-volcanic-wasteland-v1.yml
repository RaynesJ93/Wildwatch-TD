name: Add Volcanic Wasteland V1
on:
  push:
    paths:
      - '.github/workflows/add-volcanic-wasteland-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Add Volcanic Wasteland
        run: python3 .github/scripts/add_volcanic_wasteland_v1.py
      - name: Commit game update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Volcanic Wasteland 10-map series'
          git push origin main

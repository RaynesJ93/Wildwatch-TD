name: Change Bird to Pigeon
on:
  push:
    paths:
      - '.github/workflows/change-bird-to-pigeon.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change Bird card to Pigeon
        run: python3 .github/scripts/change_bird_to_pigeon.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Change Bird card to Pigeon"
          git push

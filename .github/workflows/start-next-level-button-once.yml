name: Add Start Next Level button
on:
  push:
    paths:
      - '.github/workflows/start-next-level-button-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update level completion flow
        run: python3 .github/start-next-level-button.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/start-next-level-button-once.yml .github/start-next-level-button.py
          git add index.html
          git commit -m "Replace map complete control with Start Next Level"
          git push

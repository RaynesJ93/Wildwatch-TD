name: Rebalance chest shard rewards

on: [push]

permissions:
  contents: write

jobs:
  update-chests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update chest rewards
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('const shardChance={common:1,uncommon:1,epic:.75,legendary:.60}[chestType]||.50;','const shardChance={common:1,uncommon:1,epic:1,legendary:1}[chestType]||.50;',1); s=s.replace('    }else{\n      shardAmount=range[0]+Math.floor(Math.random()*(range[1]-range[0]+1));\n    }','    }else if(chestType===\"epic\"){\n      shardAmount=Math.random()<.80 ? 2+Math.floor(Math.random()*3) : 1;\n    }else if(chestType===\"legendary\"){\n      shardAmount=Math.random()<.70 ? 2+Math.floor(Math.random()*3) : 1;\n    }else{\n      shardAmount=range[0]+Math.floor(Math.random()*(range[1]-range[0]+1));\n    }',1); p.write_text(s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chest-rebalance-once.yml
          git add index.html
          git commit -m "Rebalance Rare and Legendary chest shards"
          git push

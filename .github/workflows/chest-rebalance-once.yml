name: Rebalance chest shard rewards

on:
  push:
    paths:
      - '.github/workflows/chest-rebalance-once.yml'

permissions:
  contents: write

jobs:
  update-chests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Rare and Legendary chest shard rewards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'const shardChance={common:1,uncommon:1,epic:.75,legendary:.60}[chestType]||.50;'
          new = 'const shardChance={common:1,uncommon:1,epic:1,legendary:1}[chestType]||.50;'
          if old not in s:
              raise SystemExit('shardChance target not found')
          s = s.replace(old, new, 1)

          old2 = '''    if(chestType==="uncommon"){
      // Uncommon Chest: guaranteed 1 shard, with a 1/3 chance to award 2-4 instead.
      shardAmount=Math.random()<(1/3) ? 2+Math.floor(Math.random()*3) : 1;
    }else{
      shardAmount=range[0]+Math.floor(Math.random()*(range[1]-range[0]+1));
    }'''
          new2 = '''    if(chestType==="uncommon"){
      // Uncommon Chest: guaranteed 1 shard, with a 1/3 chance to award 2-4 instead.
      shardAmount=Math.random()<(1/3) ? 2+Math.floor(Math.random()*3) : 1;
    }else if(chestType==="epic"){
      // Rare Chest: guaranteed 1 shard, with an 80% chance to award 2-4 instead.
      shardAmount=Math.random()<.80 ? 2+Math.floor(Math.random()*3) : 1;
    }else if(chestType==="legendary"){
      // Legendary Chest: guaranteed 1 shard, with a 70% chance to award 2-4 instead.
      shardAmount=Math.random()<.70 ? 2+Math.floor(Math.random()*3) : 1;
    }else{
      shardAmount=range[0]+Math.floor(Math.random()*(range[1]-range[0]+1));
    }'''
          if old2 not in s:
              raise SystemExit('shard amount target not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit update and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chest-rebalance-once.yml
          git add index.html
          git commit -m "Rebalance Rare and Legendary chest shards"
          git push

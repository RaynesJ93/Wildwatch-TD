name: Map Summary Card XP Breakdown V1
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/map_summary_card_xp_breakdown_v1.py'
      - '.github/workflows/map-summary-card-xp-breakdown-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add per-card XP summary
        run: python .github/scripts/map_summary_card_xp_breakdown_v1.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show exact XP earned by each deck card"
          git pull --rebase origin main
          git push origin main

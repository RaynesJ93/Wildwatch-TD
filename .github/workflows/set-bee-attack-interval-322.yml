name: Set Bee attack interval to 3.22 seconds
on:
  push:
    paths:
      - '.github/workflows/set-bee-attack-interval-322.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/set-bee-attack-interval-322.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set Bee attack interval to 3.22 seconds"
          git push

name: Add Chicken Explosive Egg
on:
  push:
    paths:
      - '.github/workflows/add-chicken-explosive-egg.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Chicken Egg Bomb and Explosive Egg
        run: python3 .github/scripts/add_chicken_explosive_egg.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Chicken Egg Bomb and Explosive Egg"
          git push

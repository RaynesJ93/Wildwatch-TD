name: Add Chicken Explosive Egg
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_chicken_explosive_egg.py'
      - '.github/workflows/add-chicken-explosive-egg.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wildwatch-game-patches
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Add Chicken Egg Bomb and Explosive Egg
        run: python3 .github/scripts/add_chicken_explosive_egg.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No game changes needed"
            exit 0
          fi
          git commit -m "Add Chicken Egg Bomb and Explosive Egg V2"
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1

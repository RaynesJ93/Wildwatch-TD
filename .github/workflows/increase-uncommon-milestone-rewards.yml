name: Boost uncommon milestone rewards
on:
  push:
    paths:
      - '.github/workflows/increase-uncommon-milestone-rewards.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/increase-uncommon-milestone-rewards.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make uncommon milestone rewards 25 percent better"
          git push

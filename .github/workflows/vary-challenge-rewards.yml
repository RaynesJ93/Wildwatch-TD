name: Vary challenge quest rewards
on:
  push:
    paths:
      - '.github/workflows/vary-challenge-rewards.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch rewards
        run: python3 .github/scripts/vary_challenge_rewards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Vary challenge quest rewards"
          git push

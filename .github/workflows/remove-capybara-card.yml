name: Remove Capybara Card
on:
  push:
    paths:
      - '.github/workflows/remove-capybara-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Capybara card
        run: python3 .github/scripts/remove_capybara_card.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove Capybara card"
          git push

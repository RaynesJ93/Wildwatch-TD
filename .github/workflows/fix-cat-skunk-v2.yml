name: Fix Cat and Skunk V2
on:
  push:
    paths:
      - '.github/workflows/fix-cat-skunk-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply combined Cat and Skunk fixes
        run: python .github/scripts/fix_cat_skunk_v2.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix Cat Nine Lives and Skunk Stink Bomb"
          git push

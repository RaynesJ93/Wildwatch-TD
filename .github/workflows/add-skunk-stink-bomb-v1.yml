name: Add Skunk Stink Bomb V1

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_skunk_stink_bomb_v1.py'
      - '.github/workflows/add-skunk-stink-bomb-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Skunk Stink Bomb patch
        run: python .github/scripts/add_skunk_stink_bomb_v1.py
      - name: Commit game update
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Skunk Stink Bomb attack and level 10 ability"
          git push

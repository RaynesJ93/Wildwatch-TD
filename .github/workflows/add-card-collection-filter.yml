name: Add card collection filter
on:
  push:
    paths:
      - '.github/workflows/add-card-collection-filter.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/add-card-collection-filter.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add card collection filter dropdown"
          git push

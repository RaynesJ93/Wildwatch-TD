name: Make Common collection EXP claimable
on:
  push:
    paths:
      - '.github/workflows/make-common-all-exp-claimable.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/make-common-all-exp-claimable.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Give every Common card 500 EXP from collection milestone"
          git push

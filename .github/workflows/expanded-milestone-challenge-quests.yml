name: Add expanded milestone and challenge quests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expanded-milestone-challenge-quests.yml'

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add expanded quests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='// EXPANDED_MILESTONE_CHALLENGE_QUESTS_V1'
          if marker in s:
              raise SystemExit('Expanded quests already installed')
          insert=r'''

// EXPANDED_MILESTONE_CHALLENGE_QUESTS_V1
// Additional permanent milestones and rotating-style challenge goals.
const expandedMilestoneQuests=[

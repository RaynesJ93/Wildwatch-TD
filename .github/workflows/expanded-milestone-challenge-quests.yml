function expandedQuestCard(q){
 const claimed=!!(save.expandedQuestClaims||{})[q.id];
 return `<div class="info-box"><div style="display:flex;justify-content:space-between;gap:10px"><b>${q.icon} ${q.name}</b><span class="small">${claimed?'✅ Completed':'🎁 '+q.reward}</span></div><div class="small" style="margin-top:6px">${q.desc}</div></div>`;
}
function renderExpandedQuests(){
 const m=document.getElementById('milestoneQuestList'),c=document.getElementById('challengeQuestList');
 if(m&&!m.dataset.expanded){m.insertAdjacentHTML('beforeend',expandedMilestoneQuests.map(expandedQuestCard).join(''));m.dataset.expanded='1';}
 if(c&&!c.dataset.expanded){c.insertAdjacentHTML('beforeend',expandedChallengeQuests.map(expandedQuestCard).join(''));c.dataset.expanded='1';}
}
setInterval(renderExpandedQuests,800);
'''
          idx=s.rfind('</script>')
          if idx<0: raise SystemExit('No closing script tag found')
          s=s[:idx]+insert+s[idx:]
          p.write_text(s)
          PY
      - name: Commit game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add expanded milestone and challenge quests'
          git push origin main

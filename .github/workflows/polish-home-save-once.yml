name: Fix save slot direct continue
on:
  push:
    paths:
      - '.github/workflows/polish-home-save-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply save slot navigation fix
        run: python3 .github/polish_home_save.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/polish-home-save-once.yml .github/polish_home_save.py
          git add index.html
          git commit -m "Open selected save directly instead of returning home"
          git push

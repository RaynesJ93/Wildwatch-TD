name: Upgrade Volcanic Wasteland Visuals V2
on:
  push:
    paths:
      - '.github/workflows/upgrade-volcanic-wasteland-visuals-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Upgrade Volcanic Wasteland visuals
        run: python .github/scripts/upgrade_volcanic_wasteland_visuals_v2.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Upgrade Volcanic Wasteland visuals V2"
          git push origin main

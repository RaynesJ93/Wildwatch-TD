name: Add Parrot level 10 pineapple attack
on:
  push:
    paths:
      - '.github/workflows/add-parrot-pineapple-level10.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/add-parrot-pineapple-level10.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Parrot level 10 pineapple attack"
          git push

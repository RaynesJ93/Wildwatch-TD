name: Change seal attack visual
on:
  push:
    paths:
      - '.github/workflows/change-seal-attack-visual.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change seal attack visual
        run: python3 .github/scripts/change_seal_attack_visual.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Change seal attack to water splash"
          git push

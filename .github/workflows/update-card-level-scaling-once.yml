name: Update card level scaling
on:
  push:
    paths:
      - '.github/workflows/update-card-level-scaling-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Level 50 card scaling
        run: python3 .github/update-card-level-scaling.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-card-level-scaling-once.yml .github/update-card-level-scaling.py
          git add index.html
          git commit -m "Raise card cap and update EXP stat scaling"
          git push

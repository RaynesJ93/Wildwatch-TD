name: Emphasise Hamster Rabbit Seal
on:
  push:
    paths:
      - '.github/workflows/emphasise-hamster-rabbit-seal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emphasise Hamster Rabbit and Seal attacks
        run: python3 .github/scripts/emphasise_hamster_rabbit_seal.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make Hamster Rabbit and Seal attacks unmistakable"
          git push

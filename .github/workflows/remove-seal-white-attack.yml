name: Remove Seal White Attack
on:
  push:
    paths:
      - '.github/workflows/remove-seal-white-attack.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old Seal white attack
        run: python3 .github/scripts/remove_seal_white_attack.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove old Seal white attack"
          git push

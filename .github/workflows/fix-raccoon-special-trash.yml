name: Fix Raccoon level 10 trash special
on:
  push:
    paths:
      - '.github/workflows/fix-raccoon-special-trash.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fix-raccoon-special-trash.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Raccoon level 10 trash special"
          git push

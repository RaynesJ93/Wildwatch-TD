name: Fix battle map rendering
on:
  push:
    paths:
      - '.github/workflows/fix-battle-map-render.yml'
      - '.github/fix-battle-map-render.py'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix battle map rendering
        run: python .github/fix-battle-map-render.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore battle maps before waves start"
          git push

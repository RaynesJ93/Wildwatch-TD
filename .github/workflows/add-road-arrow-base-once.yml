name: Add road direction arrow and base
on:
  push:
    paths:
      - '.github/workflows/add-road-arrow-base-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add direction arrow and base building
        run: python3 .github/add-road-arrow-base.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-road-arrow-base-once.yml .github/add-road-arrow-base.py
          git add index.html
          git commit -m "Add road direction arrow and end base"
          git push

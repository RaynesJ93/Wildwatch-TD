name: Add Pig level 10 bacon stop
on:
  push:
    paths:
      - '.github/workflows/add-pig-level10-bacon-stop.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Pig special
        run: python .github/add-pig-level10-bacon-stop.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Pig level 10 bacon stop special"
          git push origin main

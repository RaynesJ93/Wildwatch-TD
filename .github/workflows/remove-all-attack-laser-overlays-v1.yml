name: Remove All Attack Laser Overlays V1
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/remove_all_attack_laser_overlays_v1.py'
      - '.github/workflows/remove-all-attack-laser-overlays-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/remove_all_attack_laser_overlays_v1.py
      - name: Commit game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove laser overlays from attack animations'
          git push

name: Add Pigeon Flock Frenzy V1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/add_pigeon_flock_frenzy_v1.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update main
        run: git pull --rebase origin main
      - name: Apply Pigeon update
        run: python .github/scripts/add_pigeon_flock_frenzy_v1.py
      - name: Commit game update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Pigeon Dropping Strike and Flock Frenzy'
          git push origin main

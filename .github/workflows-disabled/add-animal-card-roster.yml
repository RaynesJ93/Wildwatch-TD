name: Expand animal cards
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/run-rewards-update.txt'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply chest and level rewards
        run: python3 .github/chest-and-level-rewards.py
      - name: Commit reward changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Guarantee chest cards and rebalance level coins" || exit 0
          git push

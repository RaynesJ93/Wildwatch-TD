name: Fix daily placement and kill quest progress
on:
  push:
    paths:
      - '.github/workflows/fix-daily-placement-kill-progress.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fix-daily-placement-kill-progress.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Tower Builder and Critter Control tracking"
          git push

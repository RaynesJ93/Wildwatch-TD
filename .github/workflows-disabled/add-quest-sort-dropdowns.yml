name: Add quest sorting dropdowns
on:
  push:
    paths:
      - '.github/workflows/add-quest-sort-dropdowns.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/add-quest-sort-dropdowns.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add milestone and challenge quest sorting"
          git push

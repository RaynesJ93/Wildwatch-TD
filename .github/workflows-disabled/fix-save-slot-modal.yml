name: Fix save slot modal

on:
  push:
    paths:
      - '.github/workflows/fix-save-slot-modal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace browser prompt with in-game save modal
        run: python3 .github/scripts/fix_save_slot_modal.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix save slot creation on mobile"
          git push

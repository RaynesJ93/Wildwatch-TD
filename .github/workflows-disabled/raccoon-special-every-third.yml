name: Raccoon special every third attack
on:
  push:
    paths:
      - '.github/workflows/raccoon-special-every-third.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/raccoon-special-every-third.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Raccoon trash trigger every third attack"
          git push

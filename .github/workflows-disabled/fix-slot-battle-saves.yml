name: Fix per-slot battle saves

on:
  push:
    paths:
      - '.github/scripts/fix_slot_battle_saves.py'
      - '.github/workflows/fix-slot-battle-saves.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch battle saves
        run: python3 .github/scripts/fix_slot_battle_saves.py
      - name: Commit repaired game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Isolate battle saves per save slot'
          git push origin main

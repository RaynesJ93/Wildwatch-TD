name: Add weekly milestone challenge quests
on:
  push:
    paths:
      - '.github/workflows/add-quest-tabs.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/add-quest-tabs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add weekly milestone and challenge quest tabs"
          git push

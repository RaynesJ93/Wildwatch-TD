name: Add card pack scroll hint
on:
  push:
    paths:
      - '.github/workflows/add-pack-scroll-hint.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/add-pack-scroll-hint.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add scroll down hint to card packs"
          git push

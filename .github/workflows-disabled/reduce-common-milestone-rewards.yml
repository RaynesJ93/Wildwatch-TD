name: Reduce common milestone rewards
on:
  push:
    paths:
      - '.github/workflows/reduce-common-milestone-rewards.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/reduce-common-milestone-rewards.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reduce common card milestone rewards by 50 percent"
          git push

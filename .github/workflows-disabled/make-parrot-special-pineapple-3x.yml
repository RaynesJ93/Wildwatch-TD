name: Make Parrot special pineapple 3x larger
on:
  push:
    paths:
      - '.github/workflows/make-parrot-special-pineapple-3x.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/make-parrot-special-pineapple-3x.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Parrot special pineapple 3x larger"
          git push

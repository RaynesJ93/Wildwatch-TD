name: Remove placeholder quests
on:
  push:
    paths:
      - '.github/workflows/remove-placeholder-quests.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/remove-placeholder-quests.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove placeholder quests from quest sections"
          git push

name: Expand milestone quests
on:
  push:
    paths:
      - '.github/workflows/add-milestone-card-tiers.yml'
permissions:
  contents: write
jobs:
  update-milestones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply milestone patch
        run: python3 .github/scripts/expand_milestones_v2.py
      - name: Commit game update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes needed."
            exit 0
          fi
          git commit -m "Expand milestone quests and lifetime tracking"
          git push

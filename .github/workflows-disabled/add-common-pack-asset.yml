name: Add Common pack in-game asset
on:
  push:
    paths:
      - '.github/workflows/add-common-pack-asset.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/add-common-pack-asset.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add simple Common card pack asset"
          git push

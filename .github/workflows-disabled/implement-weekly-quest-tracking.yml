name: Implement weekly quest tracking
on:
  push:
    paths:
      - '.github/workflows/implement-weekly-quest-tracking.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/implement-weekly-quest-tracking.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Implement weekly quest progress tracking"
          git push

name: Tweak Hedgehog automatic traps
on:
  push:
    paths:
      - '.github/workflows/tweak-hedgehog-autotrap.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/tweak-hedgehog-autotrap.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Hedgehog slowly place traps without enemies"
          git push

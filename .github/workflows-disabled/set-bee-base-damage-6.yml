name: Set Bee base damage to 6
on:
  push:
    paths:
      - '.github/workflows/set-bee-base-damage-6.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/set-bee-base-damage-6.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set Bee base damage to 6"
          git push

name: Add uncommon card milestones
on:
  push:
    paths:
      - '.github/workflows/add-uncommon-card-milestones.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/add-uncommon-card-milestones.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add uncommon card collection milestones"
          git push

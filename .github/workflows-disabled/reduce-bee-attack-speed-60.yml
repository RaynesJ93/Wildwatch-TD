name: Reduce Bee attack speed by 60%
on:
  push:
    paths:
      - '.github/workflows/reduce-bee-attack-speed-60.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/reduce-bee-attack-speed-60.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reduce Bee attack speed by 60 percent"
          git push

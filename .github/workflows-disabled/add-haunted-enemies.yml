name: Add Haunted Woods enemies

on:
  push:
    paths:
      - '.github/workflows/add-haunted-enemies.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Haunted Woods enemy roster
        run: python3 .github/scripts/add_haunted_enemies.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Haunted Woods themed enemies"
          git push

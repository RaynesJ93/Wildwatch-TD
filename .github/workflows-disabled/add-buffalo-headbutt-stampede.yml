name: Add Buffalo headbutt and Stampede

on:
  push:
    paths:
      - '.github/workflows/add-buffalo-headbutt-stampede.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Buffalo attack and special
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='buffalo:{name:"Buffalo",emoji:"🐃",rarity:"Rare",cost:132,range:155,rate:1/.75,dmg:47,color:"#654",desc:"Heavy attacker."},'
          new='buffalo:{name:"Buffalo",emoji:"🐃",rarity:"Rare",cost:132,range:155,rate:1/.75,dmg:47,color:"#654",desc:"Headbutts enemies. At tower level 10, every 6th attack becomes Stampede: 2x damage to the main target, a shockwave that damages nearby enemies, and a short knockback."},'
          if old not in s:
              raise SystemExit('Buffalo card marker not found')
          s=s.replace(old,new,1)

          marker='''  if(t.key==="tiger"){
    let tigerRoar=false;'''
          insert='''  if(t.key==="buffalo"){
    let stampede=false;
    if(t.level>=10){
      t.buffaloAttackCount=(t.buffaloAttackCount||0)+1;
      stampede=t.buffaloAttackCount%6===0;
    }
    battle.shots.push({x:t.x,y:t.y-4,tx:target.x,ty:target.y,life:stampede?.34:.24,maxLife:stampede?.34:.24,type:"buffaloHeadbutt",special:stampede});
    if(stampede){
      target.hp-=dmg*2;
      if(target.hp<=0)killEnemy(target);
      battle.enemies.forEach(e=>{
        if(e.dead||e===target)return;
        if(Math.hypot(e.x-target.x,e.y-target.y)<=105){
          e.hp-=dmg*.65;
          e.tigerRoar=Math.max(e.tigerRoar||0,.75);
          if(e.hp<=0)killEnemy(e);
        }
      });
    }else{
      target.hp-=dmg;
      if(target.hp<=0)killEnemy(target);
    }
    t.cd=cardRate(t.key);
    return;
  }

  if(t.key==="tiger"){
    let tigerRoar=false;'''
          if marker not in s:
              raise SystemExit('Tiger attack marker not found')
          s=s.replace(marker,insert,1)

          marker='''    }else if(s.type==="tigerSwipe"){'''
          insert='''    }else if(s.type==="buffaloHeadbutt"){
      const q=1-Math.max(0,s.life)/(s.maxLife||.24);
      const x=s.x+(s.tx-s.x)*q,y=s.y+(s.ty-s.y)*q;
      const ang=Math.atan2(s.ty-s.y,s.tx-s.x);
      ctx.save();ctx.translate(x,y);ctx.rotate(ang);
      const thrust=Math.sin(Math.PI*q);
      ctx.translate(thrust*12,0);
      ctx.font=s.special?"42px sans-serif":"34px sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText("🐃",0,0);
      if(s.special){
        ctx.globalAlpha=Math.max(0,1-q);
        ctx.strokeStyle="#e8c56a";ctx.lineWidth=5;
        ctx.beginPath();ctx.arc(0,0,18+q*70,0,Math.PI*2);ctx.stroke();
      }
      ctx.restore();
      return;
    }else if(s.type==="tigerSwipe"){'''
          if marker not in s:
              raise SystemExit('Tiger projectile draw marker not found')
          s=s.replace(marker,insert,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Buffalo headbutt and Stampede ability'
          git push origin main

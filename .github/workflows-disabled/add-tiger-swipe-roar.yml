name: Add Tiger swipe and roar
on:
  push:
    paths:
      - '.github/workflows/add-tiger-swipe-roar.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Tiger update
        run: python .github/add-tiger-swipe-roar.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Tiger swipe and roar ability"
          git push

name: Make Parrot pineapple all levels
on:
  push:
    paths:
      - '.github/workflows/make-parrot-pineapple-all-levels.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/make-parrot-pineapple-all-levels.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use pineapple projectile for Parrot at all levels"
          git push

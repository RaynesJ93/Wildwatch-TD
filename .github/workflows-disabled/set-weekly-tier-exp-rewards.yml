name: Set weekly tier EXP rewards
on:
  push:
    paths:
      - '.github/workflows/set-weekly-tier-exp-rewards.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/set-weekly-tier-exp-rewards.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change weekly tower quest rewards to tier EXP"
          git push

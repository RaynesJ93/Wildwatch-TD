name: Add quest tiers and instant claim
on:
  push:
    paths:
      - '.github/workflows/add-quest-tiers-and-instant-claim.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quest system
        run: python3 .github/scripts/add_quest_tiers_and_instant_claim.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add tiered challenge quests and instant claimed state"
          git push

name: Add Giraffe neck swing AOE

on:
  push:
    paths:
      - '.github/workflows/add-giraffe-neck-aoe.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Giraffe attack and upgrade cost
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Describe the new role on the card.
          s=s.replace('giraffe:{name:"Giraffe",emoji:"🦒",rarity:"Legendary",cost:175,range:275,rate:1/.85,dmg:55,color:"#db7",desc:"Exceptional range attacker."}',
                      'giraffe:{name:"Giraffe",emoji:"🦒",rarity:"Legendary",cost:175,range:275,rate:1/.85,dmg:55,color:"#db7",desc:"Exceptional range attacker. Swings its neck for area damage."}',1)

          # Giraffe tower upgrades cost 35% less than the normal formula.
          s=s.replace('const mult=selectedTower.key==="pig"?.8:selectedTower.key==="tiger"?.64:1;',
                      'const mult=selectedTower.key==="pig"?.8:selectedTower.key==="tiger"?.64:selectedTower.key==="giraffe"?.65:1;',1)
          s=s.replace('up=Math.floor(a.cost*.595*t.level*(t.key==="pig"?.8:t.key==="tiger"?.64:1));',
                      'up=Math.floor(a.cost*.595*t.level*(t.key==="pig"?.8:t.key==="tiger"?.64:t.key==="giraffe"?.65:1));',1)
          s=s.replace('cost=Math.floor(a.cost*.595*selectedTower.level*(selectedTower.key==="pig"?.8:selectedTower.key==="tiger"?.64:1));',
                      'cost=Math.floor(a.cost*.595*selectedTower.level*(selectedTower.key==="pig"?.8:selectedTower.key==="tiger"?.64:selectedTower.key==="giraffe"?.65:1));',1)

          # Give Giraffe a dedicated neck-swing attack visual instead of the generic projectile.
          marker='''  if(t.key==="parrot"){
    battle.shots.push({x:t.x,y:t.y-8,tx:target.x,ty:target.y,life:.70,maxLife:.70,type:"parrotPineapple"});
  }else{
'''
          replacement='''  if(t.key==="parrot"){
    battle.shots.push({x:t.x,y:t.y-8,tx:target.x,ty:target.y,life:.70,maxLife:.70,type:"parrotPineapple"});
  }else if(t.key==="giraffe"){
    battle.shots.push({x:t.x,y:t.y-10,tx:target.x,ty:target.y,life:.34,maxLife:.34,type:"giraffeNeckSwing",radius:92});
  }else{
'''
          if marker not in s: raise SystemExit('giraffe shot marker not found')
          s=s.replace(marker,replacement,1)

          # Apply full AOE damage around the struck enemy.
          marker='''  }else if(a.splash){
    battle.enemies.forEach(e=>{if(!e.dead&&Math.hypot(e.x-target.x,e.y-target.y)<a.splash){e.hp-=dmg*.8;if(e.hp<=0)killEnemy(e)}})
  }else{target.hp-=dmg;if(target.hp<=0)killEnemy(target)}
'''
          replacement='''  }else if(t.key==="giraffe"){
    const giraffeRadius=92;
    const victims=battle.enemies.filter(e=>!e.dead&&Math.hypot(e.x-target.x,e.y-target.y)<=giraffeRadius);
    if(!victims.includes(target) && !target.dead)victims.unshift(target);
    victims.forEach(e=>{e.hp-=dmg;if(e.hp<=0)killEnemy(e)});
  }else if(a.splash){
    battle.enemies.forEach(e=>{if(!e.dead&&Math.hypot(e.x-target.x,e.y-target.y)<a.splash){e.hp-=dmg*.8;if(e.hp<=0)killEnemy(e)}})
  }else{target.hp-=dmg;if(target.hp<=0)killEnemy(target)}
'''
          if marker not in s: raise SystemExit('giraffe damage marker not found')
          s=s.replace(marker,replacement,1)

          # Draw a curved sweeping neck arc from the Giraffe toward the impact point plus an AOE pulse.
          marker='''    if(s.type==="caterpillarLeaf"||s.type==="caterpillarBigLeaf"){
'''
          replacement='''    if(s.type==="giraffeNeckSwing"){
      const q=1-Math.max(0,s.life)/(s.maxLife||.34);
      const dx=s.tx-s.x,dy=s.ty-s.y,len=Math.hypot(dx,dy)||1;
      const nx=-dy/len,ny=dx/len;
      const bend=Math.sin(q*Math.PI)*42;
      const cx=(s.x+s.tx)/2+nx*bend,cy=(s.y+s.ty)/2+ny*bend;
      ctx.save();ctx.globalAlpha=Math.max(.15,1-q*.7);ctx.lineCap="round";
      ctx.strokeStyle="#d5a34d";ctx.lineWidth=16;
      ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo(cx,cy,s.tx,s.ty);ctx.stroke();
      ctx.strokeStyle="#8a5b20";ctx.lineWidth=3;ctx.stroke();
      const sweepAng=Math.atan2(s.ty-s.y,s.tx-s.x)+(q-.5)*1.3;
      ctx.translate(s.tx,s.ty);ctx.rotate(sweepAng);ctx.strokeStyle="#ffd77b";ctx.lineWidth=6;
      ctx.beginPath();ctx.arc(0,0,28,-1.0,1.0);ctx.stroke();
      ctx.globalAlpha=Math.max(0,.65-q*.45);ctx.strokeStyle="#f1c86a";ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(0,0,(s.radius||92)*q,0,Math.PI*2);ctx.stroke();
      ctx.restore();
      return;
    }
    if(s.type==="caterpillarLeaf"||s.type==="caterpillarBigLeaf"){
'''
          if marker not in s: raise SystemExit('giraffe draw marker not found')
          s=s.replace(marker,replacement,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Giraffe neck swing AOE and cheaper upgrades'
          git push origin main

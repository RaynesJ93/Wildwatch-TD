name: Update Hedgehog needle traps
on:
  push:
    paths:
      - '.github/workflows/update-hedgehog-needle-traps.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/update-hedgehog-needle-traps.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Hedgehog fire permanent five-needle traps"
          git push

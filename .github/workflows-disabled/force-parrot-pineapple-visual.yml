name: Force Parrot pineapple visual
on:
  push:
    paths:
      - '.github/workflows/force-parrot-pineapple-visual.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/force-parrot-pineapple-visual.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Force Parrot to visibly fire pineapples"
          git push

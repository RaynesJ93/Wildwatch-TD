name: Reset Hedgehog traps each wave
on:
  push:
    paths:
      - '.github/workflows/reset-hedgehog-traps-each-wave.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/reset-hedgehog-traps-each-wave.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reset Hedgehog needle traps after every wave"
          git push

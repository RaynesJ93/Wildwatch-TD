name: Fix weekly quest rewards
on:
  push:
    paths:
      - '.github/workflows/fix-weekly-quest-rewards.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add weekly quest claims
        run: python .github/fix-weekly-quest-rewards.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix weekly quest reward claiming"
          git push

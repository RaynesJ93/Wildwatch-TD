name: Fix Raccoon special tower level trigger
on:
  push:
    paths:
      - '.github/workflows/fix-raccoon-special-tower-level.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fix-raccoon-special-tower-level.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Trigger Raccoon trash special at tower level 10"
          git push
